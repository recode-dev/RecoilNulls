name: Recoil

on:
  push:
    branches: [test]
  workflow_dispatch:
    inputs:
      prepare:
        description: prepare
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: recoil-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.prepare }}
    uses: ./.github/workflows/prepare.yml
    permissions:
      contents: write
      actions: write

  build:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.prepare) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache
        uses: actions/cache@v6
        with:
          path: ~/theos
          key: theos-${{ runner.os }}-v7

      - name: Build
        run: |
          set -euo pipefail
          export THEOS="$HOME/theos"
          if [ ! -f "$THEOS/makefiles/common.mk" ] || [ -z "$(ls -A "$THEOS/toolchain/linux/iphone" 2>/dev/null)" ]; then
            curl -fsSL -o /tmp/theos-install https://raw.githubusercontent.com/theos/theos/master/bin/install-theos
            sed -i 's/\blibxml2\b/libxml2-16/' /tmp/theos-install
            bash /tmp/theos-install </dev/null
            lib="$(dpkg -L libxml2-16 | grep 'libxml2\.so\.16$' | head -1)"
            [ -n "$lib" ] && sudo ln -sf "$lib" "$(dirname "$lib")/libxml2.so.2"
          fi
          make -j"$(( $(nproc) + 1 ))" ARCHS=arm64 DEBUG=0 FINALPACKAGE=1
          mkdir -p out
          dylib="$(find .theos -name Recoil.dylib ! -path '*dSYM*' | head -1)"
          [ -n "$dylib" ] || { echo "Recoil.dylib not found"; exit 1; }
          cp "$dylib" out/Recoil.dylib
          strip -x out/Recoil.dylib 2>/dev/null || true

      - name: Artifact
        uses: actions/upload-artifact@v7
        with:
          name: Recoil
          path: out/Recoil.dylib

      - name: Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: out/Recoil.dylib
