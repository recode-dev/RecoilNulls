name: Prepare

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

env:
  FRIDA_VERSION: 17.24.3

concurrency:
  group: prepare-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Tool
        run: npm install --global clang-format@1.8.0

      - name: Clean junk
        run: |
          set -euo pipefail
          # Only tracked files matching known junk patterns are removed.
          # grep exits 1 when nothing matches; that is not an error here.
          git ls-files -z |
            { grep -zE '(^|/)(core|\.DS_Store|Thumbs\.db)$|\.(orig|rej|bak|swp)$|~$' || true; } |
            xargs -0 -r git rm -q --

      - name: Cache
        uses: actions/cache@v6
        with:
          path: ~/theos
          key: theos-${{ runner.os }}-v6

      - name: Gum
        run: |
          set -euo pipefail
          dir="vendor/frida-gum"
          if [ -f "$dir/frida-gum.h" ] || [ -f "$dir/include/frida-gum.h" ]; then
            echo "using committed devkit"
            exit 0
          fi
          mkdir -p "$dir"
          curl -fsSL -o /tmp/gum.tar.xz \
            "https://github.com/frida/frida/releases/download/${FRIDA_VERSION}/frida-gum-devkit-${FRIDA_VERSION}-ios-arm64.tar.xz"
          tar -xJf /tmp/gum.tar.xz -C "$dir"

      - name: Theos
        run: |
          set -euo pipefail
          export THEOS="$HOME/theos"
          if [ -f "$THEOS/makefiles/common.mk" ] && [ -n "$(ls -A "$THEOS/toolchain/linux/iphone" 2>/dev/null)" ]; then
            echo "using cached theos"
            exit 0
          fi
          curl -fsSL -o /tmp/theos-install https://raw.githubusercontent.com/theos/theos/master/bin/install-theos
          sed -i 's/\blibxml2\b/libxml2-16/' /tmp/theos-install
          bash /tmp/theos-install </dev/null
          lib="$(dpkg -L libxml2-16 | grep 'libxml2\.so\.16$' | head -1)"
          [ -n "$lib" ] && sudo ln -sf "$lib" "$(dirname "$lib")/libxml2.so.2"

      - name: Tidy
        run: |
          set -euo pipefail
          export THEOS="$HOME/theos"
          if ! command -v clang-tidy >/dev/null 2>&1; then
            pip install --quiet clang-tidy || {
              sudo apt-get update -qq
              sudo apt-get install -y -qq clang-tidy
            }
          fi
          clang-tidy --version
          SDK="$(ls -d "$THEOS"/sdks/iPhoneOS*.sdk 2>/dev/null | head -1 || true)"
          if [ -z "$SDK" ]; then
            echo "no iPhoneOS sdk in $THEOS/sdks; skipping tidy"
            exit 0
          fi
          GUM="$(dirname "$(ls vendor/frida-gum/frida-gum.h vendor/frida-gum/include/frida-gum.h 2>/dev/null | head -1)")"
          python3 tools/gen_compile_db.py "$SDK" "$GUM"
          checks='-*,bugprone-*,-bugprone-easily-swappable-parameters,performance-*,portability-*,misc-unused-*,misc-definitions-in-headers,misc-redundant-expression,modernize-use-nullptr,modernize-use-override,modernize-use-emplace,modernize-use-auto,readability-braces-around-statements,readability-redundant-*,readability-simplify-boolean-expr,readability-container-size-empty,readability-uniqueptr-delete-release'
          git ls-files 'src/*.cpp' | xargs -r clang-tidy -p . --fix --quiet \
            --checks="$checks" \
            --header-filter='^(src|tools)/'
          rm -f compile_commands.json

      - name: Verify
        run: |
          set -euo pipefail
          export THEOS="$HOME/theos"
          if git diff --quiet -- src; then
            echo "tidy produced no changes"
            exit 0
          fi
          if make -j"$(( $(nproc) + 1 ))" ARCHS=arm64 DEBUG=0 FINALPACKAGE=1 >/tmp/build.log 2>&1; then
            echo "tidy result compiles"
            exit 0
          fi
          echo "tidy result does not compile; keeping only formatting"
          tail -40 /tmp/build.log || true
          git checkout -- src
          rm -rf .theos

      - name: Format
        run: |
          set -euo pipefail
          style='{BasedOnStyle: LLVM, Language: Cpp, Standard: c++17,
            IndentWidth: 4, TabWidth: 4, ContinuationIndentWidth: 4, UseTab: Never,
            ColumnLimit: 80,
            BreakBeforeBraces: Allman,
            BraceWrapping: {AfterClass: true, AfterControlStatement: Always, AfterEnum: true, AfterFunction: true, AfterNamespace: true, AfterStruct: true, AfterUnion: true, AfterExternBlock: true, BeforeCatch: true, BeforeElse: true, IndentBraces: false, SplitEmptyFunction: true, SplitEmptyRecord: true, SplitEmptyNamespace: true},
            AllowShortIfStatementsOnASingleLine: WithoutElse,
            AllowShortBlocksOnASingleLine: Empty,
            AllowShortFunctionsOnASingleLine: None,
            AllowShortLambdasOnASingleLine: None,
            AllowShortLoopsOnASingleLine: false,
            AllowShortCaseLabelsOnASingleLine: false,
            BreakBeforeTernaryOperators: true,
            BreakBeforeBinaryOperators: None,
            BinPackArguments: false,
            BinPackParameters: false,
            AlignAfterOpenBracket: Align,
            AlignConsecutiveAssignments: true,
            AlignConsecutiveDeclarations: true,
            AlignConsecutiveMacros: true,
            AlignEscapedNewlines: Left,
            AlignOperands: Align,
            AlignTrailingComments: true,
            PointerAlignment: Left,
            SpaceAfterCStyleCast: true,
            SpaceBeforeParens: ControlStatements,
            SpacesBeforeTrailingComments: 2,
            Cpp11BracedListStyle: true,
            SortIncludes: false,
            FixNamespaceComments: false,
            ReflowComments: true}'
          files() {
            git ls-files -z -- 'src/*.c' 'src/*.cpp' 'src/*.h' 'src/*.hpp' \
              'tools/*.c' 'tools/*.cpp' 'tools/*.h' 'tools/*.hpp'
          }
          # Format, strip trailing whitespace, ensure a final newline.
          files | xargs -0 -r clang-format -i -style="$style"
          files | xargs -0 -r sed -i -e 's/[[:space:]]\+$//'
          files | while IFS= read -r -d '' f; do
            if [ -s "$f" ] && [ -n "$(tail -c1 "$f")" ]; then
              printf '\n' >> "$f"
            fi
          done

      - name: Push
        id: push
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$BRANCH" = "main" ] || [ "$BRANCH" = "master" ]; then
            echo "Protected branch $BRANCH: skip push"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          # Tracked changes only (modifications and removals); never untracked files.
          git add -u
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore(prepare): tidy, format and clean"
          git pull --rebase origin "$BRANCH"
          git push origin "HEAD:$BRANCH"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Build
        if: steps.push.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build.yml --ref "$GITHUB_REF_NAME"
