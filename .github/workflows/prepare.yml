name: Prepare

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: prepare-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Tool
        run: npm install --global clang-format@1.8.0

      - name: Clean junk
        run: |
          set -euo pipefail
          # Only tracked files matching known junk patterns are removed.
          git ls-files -z |
            grep -zE '(^|/)(core|\.DS_Store|Thumbs\.db)$|\.(orig|rej|bak|swp)$|~$' |
            xargs -0 -r git rm -q --

      - name: Format
        run: |
          set -euo pipefail
          style='{BasedOnStyle: LLVM, BreakBeforeBraces: Allman, IndentWidth: 4, ContinuationIndentWidth: 4, ColumnLimit: 80, AllowShortIfStatementsOnASingleLine: WithoutElse, AllowShortBlocksOnASingleLine: Empty, AllowShortFunctionsOnASingleLine: None, AllowShortLambdasOnASingleLine: None, BreakBeforeTernaryOperators: true, BinPackArguments: false, BinPackParameters: false, PointerAlignment: Left, SortIncludes: false, FixNamespaceComments: false}'
          files() {
            git ls-files -z -- 'src/*.c' 'src/*.cpp' 'src/*.h' 'src/*.hpp' \
              'tools/*.c' 'tools/*.cpp' 'tools/*.h' 'tools/*.hpp'
          }
          # Format, strip trailing whitespace, ensure a final newline.
          files | xargs -0 -r clang-format -i -style="$style"
          files | xargs -0 -r sed -i -e 's/[[:space:]]\+$//'
          files | while IFS= read -r -d '' f; do
            if [ -s "$f" ] && [ -n "$(tail -c1 "$f")" ]; then
              printf '\n' >> "$f"
            fi
          done

      - name: Push
        id: push
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$BRANCH" = "main" ] || [ "$BRANCH" = "master" ]; then
            echo "Protected branch $BRANCH: skip push"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          # Tracked changes only (modifications and removals); never untracked files.
          git add -u
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore(prepare): format and clean"
          git pull --rebase origin "$BRANCH"
          git push origin "HEAD:$BRANCH"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Build
        if: steps.push.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build.yml --ref "$GITHUB_REF_NAME"
